name: Rust Backend Release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libxcursor-dev
      - name: Test backend
        run: |
          cargo fmt --manifest-path dms-screenshot-rs/Cargo.toml -- --check
          cargo test --manifest-path dms-screenshot-rs/Cargo.toml
      - name: Build release binary
        run: cargo build --release --manifest-path dms-screenshot-rs/Cargo.toml
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp dms-screenshot-rs/target/release/dms-screenshot-rs release-assets/dms-screenshot-rs-linux-x86_64
          chmod +x release-assets/dms-screenshot-rs-linux-x86_64
          sha256sum release-assets/dms-screenshot-rs-linux-x86_64 > release-assets/SHA256SUMS
      - name: Attest release binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/dms-screenshot-rs-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: rust-backend-release
          path: release-assets

  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libxcursor-dev
      - name: Lint backend
        run: cargo clippy --manifest-path dms-screenshot-rs/Cargo.toml --all-targets --all-features -- -D warnings

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rust-backend-release
          path: release-assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" release-assets/* --clobber
